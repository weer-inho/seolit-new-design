<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><!-- Статичный снимок макета из холста дизайна: без интерактива. Логика и переводы — в source/*.dc.html -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F4F6FA;--surface:#FFFFFF;--fg:#0D1526;--muted:#566176;--line:#E2E7F0;--soft:#EDF1F8;--accent:#2563EB;--atext:#1D4ED8;--ok:#0A7D56;--overlay:rgba(13,21,38,.5);font-family:Manrope,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.app.dark{--bg:#0A0F1A;--surface:#111827;--fg:#E8EDF7;--muted:#A3AEC2;--line:#222D44;--soft:#18223A;--atext:#8DB1FF;--ok:#3DDBA0;--overlay:rgba(0,0,0,.66)}
.chipf{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.chipf.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:center;cursor:pointer;min-height:104px}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,116,246,.3)}
.net{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font-size:13px;font-weight:800;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.lang{min-width:32px;min-height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:800 12px Manrope,system-ui,sans-serif;cursor:pointer}
.lang.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
</style>
