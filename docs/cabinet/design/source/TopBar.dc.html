<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Верхняя панель кабинета SEOlit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px; min-height: 64px; padding: 10px 28px; box-sizing: border-box; background: var(--surface, #FFFFFF); border-bottom: 1px solid var(--line, #E2E7F0); font-family: Manrope, system-ui, sans-serif; color: var(--fg, #0D1526)">
<nav aria-label="{{t.crumbs}}" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; min-width: 0">
<sc-if value="{{hasB}}" hint-placeholder-val="{{ false }}">
<a href="Main.dc.html" style="color: var(--muted, #566176); text-decoration: none; white-space: nowrap">{{crumbA}}</a>
<span aria-hidden="true" style="color: var(--faint, #7A8499)">/</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{crumbB}}</span>
</sc-if>
<sc-if value="{{noB}}" hint-placeholder-val="{{ true }}">
<span style="white-space: nowrap">{{crumbA}}</span>
</sc-if>
</nav>

<label style="flex: 1 1 220px; max-width: 420px; margin-left: 12px; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 10px 0 12px; border-radius: 11px; background: var(--soft, #EDF1F8); color: var(--muted, #566176); font-size: 14px; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="{{t.search}}" aria-label="{{t.search}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 500 14px Manrope, system-ui, sans-serif; color: var(--fg, #0D1526)">
<span style="font-size: 11px; font-weight: 800; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line, #E2E7F0); color: var(--faint, #7A8499)">Ctrl K</span>
</label>

<div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
<div role="group" aria-label="{{t.lang}}" style="display: flex; padding: 3px; border-radius: 11px; background: var(--soft, #EDF1F8)">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
</sc-for>
</div>
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line, #E2E7F0); background: var(--surface, #FFFFFF); color: var(--fg, #0D1526); display: grid; place-items: center; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
</button>
<button type="button" aria-label="{{t.notifications}}" style="position: relative; width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line, #E2E7F0); background: var(--surface, #FFFFFF); color: var(--fg, #0D1526); display: grid; place-items: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #E5484D; box-shadow: 0 0 0 2px var(--surface, #FFFFFF)"></span>
</button>
<sc-if value="{{hasAction}}" hint-placeholder-val="{{ true }}">
<a href="{{actionHref}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 11px; background: var(--accent, #2563EB); color: #FFFFFF; font-size: 14px; font-weight: 800; text-decoration: none; white-space: nowrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{action}}</a>
</sc-if>
<button type="button" aria-label="{{t.profile}}" style="display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 4px 0 4px; border: 0; background: transparent; color: var(--fg, #0D1526); cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #2563EB, #38BDF8); color: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 800">A</span>
</button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ru","en","kk"],"default":"ru"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"crumbA":{"editor":null},"crumbB":{"editor":null},"action":{"editor":null},"actionHref":{"editor":null},"onLang":{"editor":null},"onTheme":{"editor":null},"$preview":{"width":1112,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      ru: { crumbs: 'Навигация', search: 'Поиск по проектам и аккаунтам', lang: 'Язык интерфейса', notifications: 'Уведомления: 1 новое', profile: 'Профиль anna@example.ru', toDark: 'Тёмная тема', toLight: 'Светлая тема' },
      en: { crumbs: 'Breadcrumbs', search: 'Search projects and accounts', lang: 'Interface language', notifications: 'Notifications: 1 new', profile: 'Profile anna@example.ru', toDark: 'Dark theme', toLight: 'Light theme' },
      kk: { crumbs: 'Навигация', search: 'Жобалар мен аккаунттарды іздеу', lang: 'Интерфейс тілі', notifications: 'Хабарламалар: 1 жаңа', profile: 'Профиль anna@example.ru', toDark: 'Қараңғы тақырып', toLight: 'Жарық тақырып' }
    };
    const lang = T[this.props.lang] ? this.props.lang : 'ru';
    const t = T[lang];
    const isDark = this.props.theme === 'dark';
    const onLang = this.props.onLang || (() => {});
    const onTheme = this.props.onTheme || (() => {});
    const base = 'min-width: 40px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; font: 800 13px Manrope, system-ui, sans-serif; cursor: pointer; ';
    const langs = [['ru', 'RU'], ['en', 'EN'], ['kk', 'KZ']].map(([code, label]) => ({
      label,
      pressed: code === lang ? 'true' : 'false',
      style: base + (code === lang ? 'background: var(--surface, #FFFFFF); color: var(--fg, #0D1526); box-shadow: 0 1px 3px rgba(0,0,0,.12)' : 'background: transparent; color: var(--muted, #566176)'),
      pick: () => onLang(code)
    }));
    return {
      t, langs, isDark, isLight: !isDark,
      themeLabel: isDark ? t.toLight : t.toDark,
      toggleTheme: () => onTheme(),
      crumbA: this.props.crumbA || 'Проекты',
      crumbB: this.props.crumbB || '',
      hasB: !!this.props.crumbB, noB: !this.props.crumbB,
      action: this.props.action || '',
      actionHref: this.props.actionHref || 'Post.dc.html',
      hasAction: !!this.props.action
    };
  }
}
</script>
</body>
</html>
