<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SEOlit — проект, телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F4F6FA;--surface:#FFFFFF;--fg:#0D1526;--muted:#566176;--faint:#6F7A8F;--line:#E2E7F0;--soft:#EDF1F8;--accent:#2563EB;--atext:#1D4ED8;--ok:#0A7D56;--ok-bg:#E3F4EC;--err:#C42D35;--err-bg:#FCEAEB;font-family:Manrope,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.app.dark{--bg:#0A0F1A;--surface:#111827;--fg:#E8EDF7;--muted:#A3AEC2;--faint:#8792A8;--line:#222D44;--soft:#18223A;--atext:#8DB1FF;--ok:#3DDBA0;--ok-bg:rgba(61,219,160,.12);--err:#FF8A8F;--err-bg:rgba(255,138,143,.12)}
.app a{color:var(--atext)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--ok-bg);color:var(--ok)}
.net{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#fff;font-size:11px;font-weight:800;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.lang{min-width:32px;min-height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:800 12px Manrope,system-ui,sans-serif;cursor:pointer}
.lang.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:800 14px Manrope,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.chipf{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.chipf.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tog{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none;padding:0}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.tog.on{background:var(--accent)}.tog.on::after{left:21px}
.tabb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:var(--muted);font-size:11px;font-weight:800;text-decoration:none}
.tabb.on{color:var(--atext)}
</style>
</helmet>
<div class="app {{themeCls}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line)">
<a href="MProjects.dc.html" aria-label="{{t.back}}" style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--fg)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<b style="flex: 1; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</b>
<div role="group" aria-label="{{t.lang}}" style="display: flex; padding: 3px; border-radius: 10px; background: var(--soft)">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3"><button type="button" class="{{l.cls}}" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for>
</div>
<button type="button" onClick="{{toggleTheme}}" aria-label="{{t.theme}}" style="width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
</header>

<div style="flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span class="pill ok"><i></i>{{t.active}}</span><span class="lbl">{{t.paid}}</span></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span class="lbl">{{t.k1}}</span><b style="font-size: 22px">142</b></div>
<a href="#" class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--fg)"><span class="lbl">{{t.k2}}</span><b style="font-size: 22px">28</b></a>
<div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span class="lbl">{{t.k3}}</span><b style="font-size: 22px">3</b></div>
<button type="button" onClick="{{showErr}}" class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; border-color: var(--err); color: var(--fg); font: inherit; cursor: pointer"><span class="lbl">{{t.k4}}</span><b style="font-size: 22px; color: var(--err)">6</b></button>
</div>

<div class="seg" role="group" aria-label="{{t.list}}">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="2"><button type="button" class="{{s.cls}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}">{{s.label}} <span style="opacity: .65">{{s.n}}</span></button></sc-for>
</div>

<div role="group" aria-label="{{t.filter}}" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" class="{{f.cls}}" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}} <span style="opacity: .65">{{f.n}}</span></button></sc-for>
</div>

<div class="card" style="overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); background: {{r.bg}}">
<span class="net" style="background: {{r.c}}">{{r.s}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<b style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</b>
<span class="lbl" style="color: {{r.metaColor}}">{{r.meta}}</span>
</div>
<sc-if value="{{r.isErr}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 800 13px Manrope, system-ui, sans-serif; cursor: pointer">{{r.fix}}</button></sc-if>
<sc-if value="{{r.noErr}}" hint-placeholder-val="{{ true }}"><button type="button" class="{{r.togCls}}" aria-pressed="{{r.pressed}}" aria-label="{{t.toggle}}"></button></sc-if>
</div>
</sc-for>
</div>
<a href="MConnect.dc.html" style="min-height: 52px; border-radius: 14px; border: 2px dashed var(--line); color: var(--atext); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; text-decoration: none">+ {{t.connect}}</a>
</div>

<nav aria-label="{{t.nav}}" style="display: flex; align-items: center; padding: 0 8px 8px; background: var(--surface); border-top: 1px solid var(--line)">
<a href="MProjects.dc.html" class="tabb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="2"></rect><rect x="14" y="4" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>{{t.projects}}</a>
<a href="#" class="tabb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>{{t.queue}}</a>
<a href="#" aria-label="{{t.newPost}}" style="flex: none; width: 56px; height: 56px; margin: -14px 6px 0; border-radius: 18px; background: var(--accent); color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 12px 24px -8px rgba(37,99,235,.6)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="#" class="tabb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M7 15h4"></path></svg>{{t.balance}}</a>
<a href="#" class="tabb"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>{{t.more}}</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ru","en","kk"],"default":"ru"},"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { seg: 'dst', filter: 'all' }; }
  renderVals() {
    const lang0 = this.state.lang || this.props.lang || 'ru';
    const theme = this.state.theme || this.props.theme || 'dark';
    const T = {
      ru: { back: 'Назад к проектам', name: 'Магазин «Пример»', lang: 'Язык', theme: 'Сменить тему', active: 'Работает', paid: 'до 18.11.2026', k1: 'Вышло за 7 дней', k2: 'В очереди', k3: 'На паузе', k4: 'Ошибки', list: 'Список', dst: 'Приёмники', src: 'Источники', filter: 'Фильтр', fAll: 'Все', fErr: 'Ошибки', fOn: 'Работают', fOff: 'Выключены', toggle: 'Включить или выключить', connect: 'Подключить', nav: 'Основная навигация', projects: 'Проекты', queue: 'Очередь', newPost: 'Новый пост', balance: 'Баланс', more: 'Ещё' },
      en: { back: 'Back to projects', name: 'Example Store', lang: 'Language', theme: 'Switch theme', active: 'Active', paid: 'until Nov 18, 2026', k1: 'Published · 7 days', k2: 'In queue', k3: 'Paused', k4: 'Errors', list: 'List', dst: 'Destinations', src: 'Sources', filter: 'Filter', fAll: 'All', fErr: 'Errors', fOn: 'Active', fOff: 'Off', toggle: 'Turn on or off', connect: 'Connect', nav: 'Main navigation', projects: 'Projects', queue: 'Queue', newPost: 'New post', balance: 'Balance', more: 'More' },
      kk: { back: 'Жобаларға оралу', name: '«Мысал» дүкені', lang: 'Тіл', theme: 'Тақырыпты ауыстыру', active: 'Жұмыста', paid: '18.11.2026 дейін', k1: '7 күнде шықты', k2: 'Кезекте', k3: 'Кідірісте', k4: 'Қателер', list: 'Тізім', dst: 'Қабылдағыштар', src: 'Дереккөздер', filter: 'Сүзгі', fAll: 'Барлығы', fErr: 'Қателер', fOn: 'Жұмыста', fOff: 'Өшірулі', toggle: 'Қосу немесе өшіру', connect: 'Қосу', nav: 'Негізгі навигация', projects: 'Жобалар', queue: 'Кезек', newPost: 'Жаңа жазба', balance: 'Баланс', more: 'Тағы' }
    };
    const lang = T[lang0] ? lang0 : 'ru';
    const t = T[lang];
    const P = (ru, en, kk) => ({ ru, en, kk })[lang];
    const D = [
      { st: 'err', s: 'ВК', c: '#0060D1', name: P('Сообщество скидок', 'Deals community', 'Жеңілдіктер қауымдастығы'), meta: P('Нет прав на публикацию', 'No permission to post', 'Жариялау құқығы жоқ'), fix: P('Права', 'Access', 'Құқық') },
      { st: 'err', s: 'TG', c: '#1B7DB0', name: P('Чат покупателей', 'Customers chat', 'Сатып алушылар чаты'), meta: P('Бота удалили из чата', 'Bot removed from chat', 'Бот чаттан шығарылды'), fix: P('Бот', 'Bot', 'Бот') },
      { st: 'on', s: 'ВК', c: '#0060D1', name: P('Страница магазина', 'Store page', 'Дүкен беті'), meta: P('12:40 · 4 в очереди', '12:40 · 4 queued', '12:40 · 4 кезекте') },
      { st: 'on', s: 'TG', c: '#1B7DB0', name: P('Канал магазина', 'Store channel', 'Дүкен арнасы'), meta: P('3 мин назад', '3 min ago', '3 мин бұрын') },
      { st: 'on', s: 'OK', c: '#C2560A', name: P('Группа «Пример»', 'Example group', '«Мысал» тобы'), meta: P('18 мин назад', '18 min ago', '18 мин бұрын') },
      { st: 'on', s: 'Pi', c: '#C8001E', name: P('Доска «Новинки»', 'New arrivals board', '«Жаңалар» тақтасы'), meta: P('40 мин назад', '40 min ago', '40 мин бұрын') },
      { st: 'off', s: 'X', c: '#16181C', name: '@example_sale', meta: P('Выключен', 'Off', 'Өшірулі') },
      { st: 'off', s: 'ВК', c: '#0060D1', name: P('Архив 2019', 'Archive 2019', '2019 мұрағаты'), meta: P('Выключен · 1 на паузе', 'Off · 1 paused', 'Өшірулі · 1 кідірісте') }
    ];
    const S = [
      { st: 'on', s: 'RSS', c: '#D9590B', name: 'example.ru/news', meta: P('Чтение через 2 мин', 'Next read in 2 min', '2 мин кейін оқу') },
      { st: 'err', s: 'TT', c: '#C4113F', name: '@example_store', meta: P('Ссылка устарела', 'Feed link expired', 'Сілтеме ескірген'), fix: P('Обновить', 'Update', 'Жаңарту') },
      { st: 'on', s: 'YT', c: '#C4302B', name: P('Канал магазина', 'Store channel', 'Дүкен арнасы'), meta: P('Вчера', 'Yesterday', 'Кеше') },
      { st: 'off', s: 'TG', c: '#1B7DB0', name: P('Канал «Новинки»', 'New arrivals channel', '«Жаңалықтар» арнасы'), meta: P('Чтение выключено', 'Reading is off', 'Оқу өшірулі') }
    ];
    const seg = this.state.seg, filter = this.state.filter;
    const base = seg === 'dst' ? D : S;
    const rows = base.filter((r) => filter === 'all' || r.st === filter).map((r) => ({
      ...r, isErr: r.st === 'err', noErr: r.st !== 'err', fix: r.fix || '',
      bg: r.st === 'err' ? 'var(--err-bg)' : 'transparent', metaColor: r.st === 'err' ? 'var(--err)' : 'var(--muted)',
      togCls: r.st === 'on' ? 'tog on' : 'tog', pressed: r.st === 'on' ? 'true' : 'false'
    }));
    const cnt = seg === 'dst' ? { all: 62, err: 4, on: 18, off: 40 } : { all: 14, err: 2, on: 9, off: 3 };
    const segs = [['dst', t.dst, 62], ['src', t.src, 14]].map(([k, label, n]) => ({ label, n, cls: k === seg ? 'on' : '', pressed: k === seg ? 'true' : 'false', pick: () => this.setState({ seg: k }) }));
    const filters = [['all', t.fAll], ['err', t.fErr], ['on', t.fOn], ['off', t.fOff]].map(([k, label]) => ({ label, n: cnt[k], cls: k === filter ? 'chipf on' : 'chipf', pressed: k === filter ? 'true' : 'false', pick: () => this.setState({ filter: k }) }));
    const langs = [['ru', 'RU'], ['en', 'EN'], ['kk', 'KZ']].map(([k, label]) => ({ label, cls: k === lang ? 'lang on' : 'lang', pressed: k === lang ? 'true' : 'false', pick: () => this.setState({ lang: k }) }));
    return {
      t, langs, segs, filters, rows, themeCls: theme === 'dark' ? 'dark' : '',
      showErr: () => this.setState({ filter: 'err' }),
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' })
    };
  }
}
</script>
</body>
</html>
